<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiosonde Browser</title>
<script src="meteojs.bundle.js"></script>
<style>
  :root {
    --bg: #1a1a1e;
    --surface: #26262e;
    --border: #3a3a4a;
    --text: #e0e0e8;
    --muted: #888898;
    --accent: #5b9bd5;
    --accent-hover: #7ab3e8;
    --selected: #2a3a50;
    --error: #d55b5b;
    --success: #5bd57a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  header .status { color: var(--muted); font-size: 12px; }

  #app { display: flex; flex: 1; overflow: hidden; }

  /* Browse panels */
  #browse { display: flex; flex: 1; overflow: hidden; }

  /* Station panel */
  #station-panel { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #station-panel .panel-header { padding: 8px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #station-list { flex: 1; overflow-y: auto; }
  .station-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  .station-item:hover { background: var(--surface); }
  .station-item.selected { background: var(--selected); }
  .station-name { font-weight: 500; }
  .station-meta { color: var(--muted); font-size: 11px; display: flex; gap: 6px; }
  .icao-badge { background: var(--border); border-radius: 3px; padding: 0 4px; }

  /* Ascent panel */
  #ascent-panel { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #ascent-panel .panel-header { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; min-height: 33px; display: flex; align-items: center; }
  #ascent-list { flex: 1; overflow-y: auto; }
  .date-group-header { padding: 5px 10px; background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  .ascent-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .ascent-item:hover { background: var(--surface); }
  .ascent-item.selected { background: var(--selected); }
  .ascent-time { font-variant-numeric: tabular-nums; }
  .fmt-badge { font-size: 10px; background: var(--border); border-radius: 3px; padding: 1px 4px; color: var(--muted); }
  .fmt-badge.fm94 { color: var(--accent); }

  /* Diagram panel */
  #diagram-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #diagram-panel .panel-header { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; min-height: 33px; display: flex; align-items: center; }
  #diagram-container { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #diagram-container .placeholder { color: var(--muted); text-align: center; }
  #diagram-container .error-msg { color: var(--error); text-align: center; padding: 20px; }
  #diagram-container .loading { color: var(--muted); }
  #skewt { width: 100%; height: 100%; }

  /* Expanded state */
  #app.expanded #browse { flex-direction: column; }
  #app.expanded #station-panel,
  #app.expanded #ascent-panel { display: none; }
  #app.expanded #diagram-panel { flex: 1; }

  #back-btn { display: none; background: none; border: 1px solid var(--border); color: var(--accent); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #back-btn:hover { border-color: var(--accent); }
  #app.expanded #back-btn { display: inline-block; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Radiosonde Browser</h1>
  <button id="back-btn">← Stations</button>
  <span class="status" id="geo-status">Locating…</span>
</header>

<div id="app">
  <div id="browse">
    <div id="station-panel">
      <div class="panel-header">
        <input id="search" type="search" placeholder="Search name or ICAO…">
      </div>
      <div id="station-list"></div>
    </div>

    <div id="ascent-panel">
      <div class="panel-header" id="ascent-header">Select a station</div>
      <div id="ascent-list"></div>
    </div>

    <div id="diagram-panel">
      <div class="panel-header" id="diagram-header">Select an ascent</div>
      <div id="diagram-container">
        <div class="placeholder">← Pick a station and ascent to view sounding</div>
      </div>
    </div>
  </div>
</div>

<script>
// Haversine distance in km
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDate(ms) {
  const d = new Date(ms);
  return d.toISOString().slice(0,10);
}
function formatTime(ms) {
  const d = new Date(ms);
  return d.toISOString().slice(11,16) + ' UTC';
}

// Build station array
const stationArr = Object.entries(STATIONS).map(([id, s]) => ({id, ...s}));

let allStations = stationArr;
let userLat = null, userLon = null;
let selectedStationId = null;
let selectedAscentMs = null;
let currentDiagram = null;

const stationListEl = document.getElementById('station-list');
const ascentListEl = document.getElementById('ascent-list');
const ascentHeaderEl = document.getElementById('ascent-header');
const diagramHeaderEl = document.getElementById('diagram-header');
const diagramContainerEl = document.getElementById('diagram-container');
const searchEl = document.getElementById('search');
const geoStatusEl = document.getElementById('geo-status');
const appEl = document.getElementById('app');
const backBtn = document.getElementById('back-btn');

function renderStationList(stations) {
  if (!stations.length) {
    stationListEl.innerHTML = '<div style="padding:12px;color:var(--muted)">No stations found</div>';
    return;
  }
  stationListEl.innerHTML = stations.map(s => {
    const distStr = s.distance_km != null ? `${s.distance_km} km` : '';
    const icao = s.icao ? `<span class="icao-badge">${s.icao}</span>` : '';
    return `<div class="station-item${s.id === selectedStationId ? ' selected' : ''}" data-id="${s.id}">
      <div class="station-name">${s.name}</div>
      <div class="station-meta">${icao}${distStr ? `<span>${distStr}</span>` : ''}${s.elevation_m != null ? `<span>${s.elevation_m}m</span>` : ''}</div>
    </div>`;
  }).join('');
}

function filterAndRender() {
  const q = searchEl.value.trim().toLowerCase();
  let list = allStations;
  if (q) {
    list = allStations.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.icao && s.icao.toLowerCase().includes(q))
    );
  }
  renderStationList(list);
}

searchEl.addEventListener('input', filterAndRender);

stationListEl.addEventListener('click', e => {
  const item = e.target.closest('.station-item');
  if (!item) return;
  const id = item.dataset.id;
  if (id === selectedStationId) return;
  selectedStationId = id;
  // Update selection style
  stationListEl.querySelectorAll('.station-item').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
  loadAscents(id);
});

async function loadAscents(stationId) {
  const s = STATIONS[stationId];
  ascentHeaderEl.textContent = s ? s.name : stationId;
  ascentListEl.innerHTML = '<div style="padding:12px;color:var(--muted)">Loading…</div>';

  try {
    const url = `https://node.windy.com/obs/measurement/v2/radiosonde/${stationId}/1/1?pr=0&sc=0&token2=pending`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const history = (data.history || []).slice().sort((a,b) => b.time - a.time);

    if (!history.length) {
      ascentListEl.innerHTML = '<div style="padding:12px;color:var(--muted)">No ascents found</div>';
      return;
    }

    // Group by date
    const groups = {};
    history.forEach(a => {
      const d = formatDate(a.time);
      if (!groups[d]) groups[d] = [];
      groups[d].push(a);
    });

    ascentListEl.innerHTML = Object.entries(groups).map(([date, ascents]) =>
      `<div class="date-group-header">${date}</div>` +
      ascents.map(a =>
        `<div class="ascent-item" data-time="${a.time}" data-fmt="${a.format}">
          <span class="ascent-time">${formatTime(a.time)}</span>
          <span class="fmt-badge ${a.format}">${a.format}</span>
        </div>`
      ).join('')
    ).join('');
  } catch(err) {
    ascentListEl.innerHTML = `<div style="padding:12px;color:var(--error)">Error: ${err.message}</div>`;
  }
}

ascentListEl.addEventListener('click', e => {
  const item = e.target.closest('.ascent-item');
  if (!item) return;
  const timeMs = +item.dataset.time;
  const fmt = item.dataset.fmt;
  ascentListEl.querySelectorAll('.ascent-item').forEach(el => el.classList.toggle('selected', el === item));
  loadSounding(selectedStationId, timeMs, fmt);
});

async function loadSounding(stationId, timeMs, fmt) {
  const s = STATIONS[stationId];
  const timeStr = new Date(timeMs).toISOString().slice(0,16) + ' UTC';
  diagramHeaderEl.textContent = `${s ? s.name : stationId} — ${timeStr}`;
  diagramContainerEl.innerHTML = '<div class="loading">Loading sounding…</div>';

  // Expand to diagram view
  appEl.classList.add('expanded');

  try {
    const url = `https://dl.windy.com/obs/measurement/v2/radiosonde/${stationId}/download?time=${timeMs}&format=${fmt}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    const features = geojson.features || geojson.sounding?.features || [];
    const levels = features.filter(f => f.geometry?.type === 'Point');

    if (!levels.length) throw new Error('No level data in sounding');

    // Build meteoJS sounding
    const sounding = new meteoJS.Sounding();
    levels.forEach(f => {
      const p = f.properties;
      const wspd = Math.sqrt((p.wind_u||0)**2 + (p.wind_v||0)**2);
      const wdir = ((270 - Math.atan2(p.wind_v||0, p.wind_u||0) * 180 / Math.PI) % 360 + 360) % 360;
      sounding.addLevel({
        pres: p.pressure,
        tmpk: p.temp,
        dwpk: p.dewpoint,
        hght: p.gpheight,
        wspd,
        wdir
      });
    });

    // Render diagram
    diagramContainerEl.innerHTML = '<div id="skewt"></div>';
    const el = document.getElementById('skewt');
    const w = diagramContainerEl.clientWidth;
    const h = diagramContainerEl.clientHeight;

    const diagram = new meteoJS.ThermodynamicDiagram({
      renderTo: el,
      width: w,
      height: h
    });
    diagram.addSounding(sounding, {
      diagram: { visible: true },
      windbarbs: { visible: true }
    });

  } catch(err) {
    diagramContainerEl.innerHTML = `<div class="error-msg">Failed to load sounding:<br>${err.message}</div>`;
  }
}

backBtn.addEventListener('click', () => {
  appEl.classList.remove('expanded');
});

// Geolocation init
navigator.geolocation.getCurrentPosition(
  pos => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    geoStatusEl.textContent = `${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°`;

    const nearby = stationArr
      .map(s => ({...s, distance_km: Math.round(haversine(userLat, userLon, s.lat, s.lon) * 10) / 10}))
      .filter(s => s.distance_km <= 300)
      .sort((a,b) => a.distance_km - b.distance_km);

    allStations = nearby.length ? nearby : stationArr;
    if (!nearby.length) geoStatusEl.textContent += ' (no stations within 300km, showing all)';
    filterAndRender();
  },
  () => {
    geoStatusEl.textContent = 'Location unavailable — showing all stations';
    allStations = stationArr.slice().sort((a,b) => a.name.localeCompare(b.name));
    filterAndRender();
  },
  { timeout: 8000 }
);
</script>
</body>
</html>
